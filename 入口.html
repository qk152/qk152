<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2D4A3E">
<meta name="color-scheme" content="light">
<title>养老政策速查 · 进入</title>
<style>
:root{
  --green:#2D4A3E;--green-2:#3D5F51;--gold:#C8A96E;--gold-2:#E3D2AE;--gold-3:#F4ECDA;
  --bg:#F7F5F0;--card:#FFFFFF;--ink:#1F2A24;--muted:#6B7A70;--line:#E4DED2;
  --shadow:0 6px 24px rgba(45,74,62,.08);--shadow-2:0 16px 44px rgba(45,74,62,.13);
  --ft:"Noto Serif SC","Songti SC",serif;--fb:"Noto Sans SC","PingFang SC",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);
  display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 82% 12%,rgba(200,169,110,.20),transparent 55%),
                   radial-gradient(circle at 12% 88%,rgba(45,74,62,.10),transparent 55%);
}
.card{
  width:100%;max-width:460px;background:var(--card);border-radius:16px;
  border:1px solid rgba(45,74,62,.06);box-shadow:var(--shadow-2);
  padding:44px 32px 34px;text-align:center;
  animation:rise .6s cubic-bezier(.22,1,.36,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(22px);}to{opacity:1;transform:none;}}
.kicker{
  display:inline-block;padding:4px 14px;border-radius:999px;font-size:12px;
  letter-spacing:.16em;color:var(--green);background:rgba(200,169,110,.18);
  border:1px solid rgba(200,169,110,.35);
}
h1{
  margin:20px 0 0;font-family:var(--ft);font-size:clamp(30px,7vw,42px);
  letter-spacing:.10em;color:var(--green);line-height:1.3;
}
.sub{margin:12px 0 0;font-size:15px;color:var(--muted);letter-spacing:.04em;}
.rule{
  width:56px;height:3px;border-radius:3px;margin:26px auto;
  background:linear-gradient(90deg,var(--gold),var(--gold-2));
}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:20px 24px;border-radius:12px;text-decoration:none;
  font-family:var(--ft);font-size:21px;font-weight:700;letter-spacing:.10em;
  color:#2D4A3E;background:var(--gold);
  box-shadow:0 12px 30px rgba(200,169,110,.35);
  transition:transform .25s ease,box-shadow .25s ease,background .25s ease;
}
.btn:hover,.btn:focus-visible{
  background:#D3B67C;transform:translateY(-2px);
  box-shadow:0 16px 36px rgba(200,169,110,.45);outline:none;
}
.btn:active{transform:translateY(0);}
.btn span{transition:transform .25s ease;}
.btn:hover span{transform:translateX(4px);}
.foot{
  margin-top:28px;padding-top:20px;border-top:1px dashed var(--line);
  font-size:13px;line-height:1.8;color:var(--muted);
}
.foot b{color:var(--green);font-weight:700;}
.foot .addr{
  display:block;margin-top:10px;padding:9px 12px;border-radius:10px;
  background:var(--bg);border:1px solid var(--line);
  font-family:Consolas,"Courier New",monospace;font-size:12.5px;
  color:var(--green);word-break:break-all;
}
@media (max-width:480px){
  .card{padding:34px 22px 26px;}
  .btn{padding:18px;font-size:19px;}
  .foot{font-size:12.5px;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>
<main class="card">
  <span class="kicker">民政 · 财政 · 中国政府网</span>
  <h1>养老政策速查</h1>
  <p class="sub">认知障碍家庭补贴申领指南</p>
  <div class="rule" aria-hidden="true"></div>
  <a class="btn" href="./index.html">进入网站 <span aria-hidden="true">→</span></a>
  <div class="foot">
    <p>本页由电脑上的本地服务提供，<b>不依赖外网</b>。</p>
    <p>手机需与电脑连接同一 Wi-Fi 或热点。</p>
    <span class="addr" id="addr">正在识别访问地址…</span>
  </div>
</main>
<script>
(function () {
  'use strict';
  var node = document.getElementById('addr');
  if (!node) return;
  try {
    var loc = window.location;
    if (loc.protocol === 'http:' || loc.protocol === 'https:') {
      node.textContent = '当前访问地址：' + loc.origin + '/index.html';
    } else {
      node.textContent = '本地文件方式打开，局域网地址以启动窗口显示的为准';
    }
  } catch (e) {
    node.textContent = '局域网地址以启动窗口显示的为准';
  }
})();
</script>
</body>
</html>
